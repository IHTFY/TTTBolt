<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta
			name="description"
			content="A tic-tac-toe twist where each player keeps only three marks on the board, and the oldest one vanishes with every new move. Plays offline."
		/>
		<meta name="theme-color" content="#2e9fe0" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="TTT Bolt" />
		<script>
			// A browser that may hold an ad-free token (mayBeAdFree in src/lib/ads.ts) lays the
			// page out without the ad beside the board from the first paint.
			try {
				if (localStorage.getItem('ihtfy-ad-free'))
					document.documentElement.classList.add('ad-free');
			} catch {
				// Storage off: the cookie may still hold the token.
			}
			// Dark mode from the first paint: the saved choice, or the system setting (src/lib/theme.ts).
			try {
				var saved = localStorage.getItem('mode-watcher-mode');
			} catch {
				// Storage off: follow the system setting.
			}
			var light =
				saved === 'light' ||
				(saved !== 'dark' &&
					typeof matchMedia === 'function' &&
					matchMedia('(prefers-color-scheme: light)').matches);
			document.documentElement.classList.toggle('dark', !light);
			document.documentElement.style.colorScheme = light ? 'light' : 'dark';
			document
				.querySelector('meta[name="theme-color"]')
				.setAttribute('content', light ? '#2e9fe0' : '#07090d');
			try {
				if (/(?:^|;\s*)ihtfy-ad-free=/.test(document.cookie))
					document.documentElement.classList.add('ad-free');
			} catch {
				// Cookies off too: the page lays out with the ad's space, as for anyone else.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
