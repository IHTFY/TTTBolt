<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="TTT Bolt" />
		<script>
			// A browser that may hold an ad-free token (mayBeAdFree in src/lib/ads.ts) lays the
			// page out without the ad beside the board from the first paint.
			try {
				if (localStorage.getItem('ihtfy-ad-free'))
					document.documentElement.classList.add('ad-free');
			} catch {
				// Storage off: the cookie may still hold the token.
			}
			try {
				if (/(?:^|;\s*)ihtfy-ad-free=/.test(document.cookie))
					document.documentElement.classList.add('ad-free');
			} catch {
				// Cookies off too: the page lays out with the ad's space, as for anyone else.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
